<div class="flex h-screen overflow-hidden bg-gray-50 dark:bg-slate-900">
  <!-- ===================== SIDEBAR ===================== -->
  <aside
    [class]="sidebarCollapsed() ? 'w-16' : 'w-sidebar'"
    class="hidden lg:flex flex-col flex-shrink-0 bg-white dark:bg-slate-800 border-r border-gray-200 dark:border-slate-700 transition-all duration-300 overflow-hidden"
  >
    <!-- Logo -->
    <div
      class="flex items-center gap-3 px-4 py-5 border-b border-gray-100 dark:border-slate-700"
    >
      <div
        class="w-9 h-9 bg-indigo-600 rounded-xl flex items-center justify-center flex-shrink-0"
      >
        <span class="text-white font-bold text-sm">S</span>
      </div>
      @if (!sidebarCollapsed()) {
        <span class="font-bold text-gray-900 dark:text-white text-lg"
          >SSDM</span
        >
      }
    </div>

    <!-- Nav -->
    <nav class="flex-1 p-3 space-y-1 overflow-y-auto">
      @for (item of navItems; track item.route) {
        <a
          [routerLink]="item.route"
          routerLinkActive="bg-indigo-50 dark:bg-indigo-900/30 text-indigo-600 dark:text-indigo-400"
          [routerLinkActiveOptions]="{ exact: false }"
          class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-gray-600 dark:text-slate-400 hover:bg-gray-100 dark:hover:bg-slate-700 hover:text-gray-900 dark:hover:text-white transition-all duration-150 group"
          [title]="sidebarCollapsed() ? item.label : ''"
        >
          <span class="text-lg flex-shrink-0">{{ getIcon(item.icon) }}</span>
          @if (!sidebarCollapsed()) {
            <span class="text-sm font-medium">{{ item.label }}</span>
          }
        </a>
      }
    </nav>

    <!-- Collapse toggle -->
    <div class="p-3 border-t border-gray-100 dark:border-slate-700">
      <button
        (click)="toggleSidebar()"
        class="w-full flex items-center justify-center gap-2 px-3 py-2 text-gray-400 hover:text-gray-600 dark:hover:text-slate-300 hover:bg-gray-100 dark:hover:bg-slate-700 rounded-xl transition text-sm"
      >
        {{ sidebarCollapsed() ? "→" : "←" }}
        @if (!sidebarCollapsed()) {
          <span>Collapse</span>
        }
      </button>
    </div>
  </aside>

  <!-- ===================== MAIN AREA ===================== -->
  <div class="flex flex-col flex-1 min-w-0 overflow-hidden">
    <!-- TOP NAVBAR -->
    <header
      class="h-navbar flex items-center gap-4 px-4 lg:px-6 bg-white dark:bg-slate-800 border-b border-gray-200 dark:border-slate-700 flex-shrink-0"
    >
      <!-- Mobile menu button -->
      <button
        (click)="mobileMenuOpen.set(true)"
        class="lg:hidden p-2 text-gray-500 hover:text-gray-700"
      >
        <svg
          class="w-5 h-5"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M4 6h16M4 12h16M4 18h16"
          />
        </svg>
      </button>

      <!-- Page title -->
      <h1
        class="font-semibold text-gray-900 dark:text-white text-lg hidden lg:block"
      >
        {{ pageTitle() }}
      </h1>

      <!-- Search bar -->
      <div class="flex-1 max-w-xl mx-auto">
        <div class="relative">
          <svg
            class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
            />
          </svg>
          <input
            type="text"
            placeholder="Search assignments, subjects…"
            class="w-full pl-9 pr-4 py-2 bg-gray-100 dark:bg-slate-700 border-0 rounded-xl text-sm text-gray-700 dark:text-slate-300 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-400"
          />
        </div>
      </div>

      <!-- Right actions -->
      <div class="flex items-center gap-2">
        <!-- Dark mode toggle -->
        <button
          (click)="toggleDark()"
          class="p-2 text-gray-500 hover:text-gray-700 dark:text-slate-400 dark:hover:text-white hover:bg-gray-100 dark:hover:bg-slate-700 rounded-xl transition"
        >
          @if (darkMode()) {
            <svg
              class="w-5 h-5"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707M17.657 17.657l-.707-.707M6.343 6.343l-.707-.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"
              />
            </svg>
          } @else {
            <svg
              class="w-5 h-5"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"
              />
            </svg>
          }
        </button>

        <!-- Notifications bell -->
        <a
          routerLink="/notifications"
          class="relative p-2 text-gray-500 hover:text-gray-700 dark:text-slate-400 dark:hover:text-white hover:bg-gray-100 dark:hover:bg-slate-700 rounded-xl transition"
        >
          <svg
            class="w-5 h-5"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"
            />
          </svg>
          <span
            class="absolute top-1 right-1 w-2 h-2 bg-red-500 rounded-full"
          ></span>
        </a>

        <!-- User avatar -->
        <div class="relative">
          <button
            (click)="toggleUserMenu()"
            class="flex items-center gap-2 p-1 rounded-xl hover:bg-gray-100 dark:hover:bg-slate-700 transition"
          >
            <img
              [src]="
                auth.user()?.avatarUrl ||
                'https://ui-avatars.com/api/?name=User&background=4F46E5&color=fff'
              "
              class="w-8 h-8 rounded-full object-cover"
              [alt]="auth.user()?.name"
            />
            <span
              class="hidden md:block text-sm font-medium text-gray-700 dark:text-slate-300"
              >{{ auth.user()?.name }}</span
            >
          </button>
          @if (userMenuOpen()) {
            <div
              class="absolute right-0 top-12 bg-white dark:bg-slate-800 border border-gray-200 dark:border-slate-700 rounded-xl shadow-lg py-1 w-48 z-50"
            >
              <a
                routerLink="/settings"
                (click)="userMenuOpen.set(false)"
                class="flex items-center gap-2 px-4 py-2.5 text-sm text-gray-700 dark:text-slate-300 hover:bg-gray-50 dark:hover:bg-slate-700"
                >⚙️ Settings</a
              >
              <hr class="my-1 border-gray-100 dark:border-slate-700" />
              <button
                (click)="logout()"
                class="w-full flex items-center gap-2 px-4 py-2.5 text-sm text-red-600 hover:bg-red-50 dark:hover:bg-red-900/20"
              >
                🚪 Log out
              </button>
            </div>
          }
        </div>
      </div>
    </header>

    <!-- PAGE CONTENT -->
    <main class="flex-1 overflow-y-auto p-4 lg:p-6 page-transition">
      <router-outlet />
    </main>

    <!-- MOBILE BOTTOM NAV -->
    <nav
      class="lg:hidden flex border-t border-gray-200 dark:border-slate-700 bg-white dark:bg-slate-800"
    >
      <a
        routerLink="/dashboard"
        routerLinkActive="text-indigo-600"
        class="flex-1 flex flex-col items-center py-3 text-gray-500 dark:text-slate-400 text-xs gap-1"
      >
        <svg
          class="w-5 h-5"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"
          />
        </svg>
        Home
      </a>
      <a
        routerLink="/assignments"
        routerLinkActive="text-indigo-600"
        class="flex-1 flex flex-col items-center py-3 text-gray-500 dark:text-slate-400 text-xs gap-1"
      >
        <svg
          class="w-5 h-5"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"
          />
        </svg>
        Tasks
      </a>
      <a
        routerLink="/study-planner"
        routerLinkActive="text-indigo-600"
        class="flex-1 flex flex-col items-center py-3 text-gray-500 dark:text-slate-400 text-xs gap-1"
      >
        <svg
          class="w-5 h-5"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"
          />
        </svg>
        Planner
      </a>
      <a
        routerLink="/settings"
        routerLinkActive="text-indigo-600"
        class="flex-1 flex flex-col items-center py-3 text-gray-500 dark:text-slate-400 text-xs gap-1"
      >
        <svg
          class="w-5 h-5"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
          />
        </svg>
        Profile
      </a>
    </nav>
  </div>
</div>
